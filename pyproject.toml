[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-test"
version = "1.0.0"
description = "LLM 接口连通性自测工具 — CLI + Web UI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.12.0",
    "requests>=2.31.0",
    "streamlit>=1.32.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
llm-test = "llm_test.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_test"]
